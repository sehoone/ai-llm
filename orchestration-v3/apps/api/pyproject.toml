[project]
name = "orchestration-v3-api"
version = "0.1.0"
description = "V3 단일 Python 백엔드 (FastAPI) — LLM + 플랫폼 도메인"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlmodel>=0.0.22",
    "psycopg[binary,pool]>=3.2",  # pool: mem0 pgvector가 psycopg_pool 요구 (ADR-0015)
    "pgvector>=0.3",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",       # JWT 발급/검증 (자체 HS256 + 보존된 OIDC JWKS)
    "bcrypt>=4.2",             # 비밀번호 해싱 (자체 ID/PW 인증)
    "langchain>=0.3",
    "langgraph>=0.2",
    "langchain-litellm>=0.2",  # provider 통합(azure/openai/anthropic/google/ollama) — engine/llm (ADR-0010)
    "langfuse>=3",             # LLM 관측 — 트레이스/토큰/비용 (ADR-0007)
    "mem0ai>=1.0",             # 장기 메모리 (engine/memory, pgvector) — ADR-0015
    "azure-identity>=1.19",    # mem0 azure_openai 임베더/LLM이 top-level import (llm_resource가 azure일 때) — ADR-0015
    "minio>=7.2",              # 첨부 객체 스토리지 (S3 호환) — ADR-0017
    "markitdown[pdf,docx,pptx,xlsx]>=0.0.1",  # 문서 본문 추출 (PDF·Office → markdown) — ADR-0016
    "apscheduler>=3.10",        # 워크플로우 cron 스케줄 트리거 (ADR-0019) — 도메인 인프라
    "langchain-community>=0.3", # 워크플로우 tool 노드 web_search(DuckDuckGo) — ADR-0019
    "ddgs>=6.0",                # DuckDuckGo 검색 백엔드 (langchain-community DuckDuckGoSearchResults)
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    "poethepoet>=0.30",
    "import-linter>=2.1",       # 레이어 경계 강제 (ADR-0005)
]

[tool.poe.tasks]
format = "ruff format ."
test = "pytest"

# bare-metal 개발: env 단일 소스(deploy/environments/local/api.env)를 읽는다 (ADR-0018).
# localhost 좌표를 쓰려면 로컬 스택(task deploy ENV=local)이 떠 있어야 한다(db:8066 등).
[tool.poe.tasks.dev]
cmd = "uvicorn src.main:app --reload --host 0.0.0.0 --port 8000"
env = { ENV_FILE = "../../deploy/environments/local/api.env" }

[tool.poe.tasks.lint]
# ruff + 레이어 경계(import-linter) 순차 실행
sequence = ["ruff check .", "lint-imports"]
default_item_type = "cmd"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# ── 레이어 경계 계약 (ADR-0005) — `lint-imports`로 검사 ──
[tool.importlinter]
root_package = "src"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "단방향 레이어: domains → platform → engine → core"
type = "layers"
layers = [
    "src.domains",
    "src.platform",   # 공유 커널(identity·llm_resource) — domains가 의존, 자신은 domains 비의존
    "src.engine",
    "src.core",
]

[[tool.importlinter.contracts]]
name = "engine은 HTTP를 모른다 (FastAPI 비의존)"
type = "forbidden"
source_modules = ["src.engine"]
forbidden_modules = ["fastapi", "starlette"]

# ── 도메인 간 경계 (협업 지속가능성) ──
# 오케스트레이터(chat·meeting·gpts·workflow)는 능력 도메인(artifact·rag·ai_overview) 위.
# 같은 레이어 내 `|` 형제들은 서로 독립(한 명의 변경이 다른 도메인을 깨지 못함).
# 능력→오케스트레이터 역방향 import·기능 간 교차 결합을 import-linter가 CI에서 거부한다.
[[tool.importlinter.contracts]]
name = "도메인 경계: 오케스트레이터 > 능력, 기능끼리 독립"
type = "layers"
layers = [
    "src.domains.chat | src.domains.meeting | src.domains.gpts | src.domains.workflow",
    "src.domains.artifact | src.domains.rag | src.domains.ai_overview",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
