server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:

  # Docker 컨테이너 로그 자동 수집
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          # orchestration-v3-<env>(local|dev|stg|prd) 프로젝트 컨테이너만 수집
          # deploy.py가 --project-name orchestration-v3-<env>로 기동 (CLAUDE.md)
          - name: label
            values: ["com.docker.compose.project"]

    relabel_configs:
      # v3 스택이 아닌 컨테이너는 제외
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        regex: 'orchestration-v3-.*'
        action: keep

      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container

      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: service

      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: project

      - target_label: job
        replacement: 'docker'

    pipeline_stages:
      # api(uvicorn)·web(Next.js)는 평문 로그. 로그 라인에서 레벨만 추출해 라벨화.
      # (구조화 JSON 로깅 도입 시 json stage로 교체)
      - regex:
          expression: '(?P<level>INFO|WARN|WARNING|ERROR|DEBUG|CRITICAL)'
      - labels:
          level:
