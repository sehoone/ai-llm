global:
  scrape_interval: 15s
  evaluation_interval: 15s

# 경보 규칙 + Alertmanager 라우팅 (ADR-0032 Phase 3).
rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # api /metrics — 관측 미들웨어 이식 시 활성화
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
