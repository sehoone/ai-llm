# Alertmanager 설정 (ADR-0032 Phase 3) — Prometheus 경보 라우팅.
# 기본 수신자는 채널 미연결(알림 그룹핑·보관만). 운영에서 이메일/Slack/webhook을 연결한다.
route:
  receiver: default
  group_by: ["alertname"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: default
    # 실제 알림 채널을 여기에 연결한다(미설정이면 수신처 없음 → 알림은 Alertmanager UI/Prometheus에만 보임).
    # 예시(운영):
    #   slack_configs:
    #     - api_url: "https://hooks.slack.com/services/XXX"   # 비밀값은 env/secret로 분리 (ADR-0018)
    #       channel: "#alerts"
    #   webhook_configs:
    #     - url: "http://your-webhook:9000/alert"
