# WebSocket Upgrade 헤더 처리
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    client_max_body_size 50m;   # 오디오/문서 업로드

    # Docker 내부 DNS 리졸버 (컨테이너 재시작 대응)
    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;

    # ── 모든 API → api (단일 백엔드, ADR-0003) ──────────────────
    # V2의 platform 게이트웨이 경유가 사라짐 — api가 직접 모든 /api/* 처리.
    location /api/ {
        set $upstream_api api:8000;
        proxy_pass http://$upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # SSE 스트리밍을 위한 버퍼 비활성화
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400;
    }

    # ── Next.js web ─────────────────────────────────────────────
    location / {
        set $upstream_web web:3000;
        proxy_pass http://$upstream_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
    }
}
