# WebSocket Upgrade 헤더 처리
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── 레이트리밋 (ADR-0032 Phase 2) — 인증 엔드포인트만. 단일 진입점이라 레플리카 수와 무관하게 전역 일관.
#    앱 인메모리 레이트리밋(구 core/ratelimit.py)을 대체한다. IP(X-Forwarded-For 첫 주소 = $binary_remote_addr).
limit_req_zone $binary_remote_addr zone=login:10m rate=20r/m;      # 로그인 무차별 대입 완화
limit_req_zone $binary_remote_addr zone=register:10m rate=5r/m;    # 셀프 가입 남용 완화

server {
    listen 80;
    client_max_body_size 50m;   # 오디오/문서 업로드

    # Docker 내부 DNS 리졸버 (컨테이너 재시작 대응)
    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;

    location = /health {
        set $upstream_api api:8000;
        proxy_pass http://$upstream_api/health;
    }

    # ── 헬스 하위 경로 (ADR-0032) — /health/live·/health/ready 프록시(LB가 nginx 경유로 readiness 조회). ──
    location /health/ {
        set $upstream_api api:8000;
        proxy_pass http://$upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 인증 엔드포인트 (레이트리밋 적용 — ADR-0032 Phase 2) ──────
    # exact-match라 아래 prefix `/api/`보다 우선. limit_req만 다르고 프록시 설정은 동일.
    location = /api/v1/auth/login {
        limit_req zone=login burst=10 nodelay;
        limit_req_status 429;
        set $upstream_api api:8000;
        proxy_pass http://$upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/v1/auth/register {
        limit_req zone=register burst=5 nodelay;
        limit_req_status 429;
        set $upstream_api api:8000;
        proxy_pass http://$upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 모든 API → api (단일 백엔드, ADR-0003) ──────────────────
    # V2의 platform 게이트웨이 경유가 사라짐 — api가 직접 모든 /api/* 처리.
    location /api/ {
        set $upstream_api api:8000;
        proxy_pass http://$upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 원본 scheme 전파 (ADR-0032) — 앞단 TLS 종단 시 api가 https를 인식(--proxy-headers).
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # SSE 스트리밍을 위한 버퍼 비활성화
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400;
    }

    # ── 관리자 UI(admin) → /admin 하위 (ADR-0020, admin basePath=/admin) ──
    # /admin 자산·라우트(/admin/_next/...)는 전부 admin이 처리. 더 긴 prefix라 아래 `/`보다 우선 매칭.
    location /admin {
        set $upstream_admin admin:3000;
        proxy_pass http://$upstream_admin;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
    }

    # ── 사용자 포털(portal) → 루트 (ADR-0020) ───────────────────
    location / {
        set $upstream_portal portal:3000;
        proxy_pass http://$upstream_portal;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
    }
}
