services:
  # ─────────────────────────────────────────────
  # Nginx 리버스 프록시 (단일 진입점)
  #   :8060       → web (Next.js)
  #   :8060/api/* → api (FastAPI 단일 백엔드)
  # ─────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: v3-nginx
    ports:
      - "8060:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api
    networks: [app-network]
    restart: always

  # ─────────────────────────────────────────────
  # web (Next.js)
  # ─────────────────────────────────────────────
  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      args:
        ENV_FILE: .env.production
    container_name: v3-web
    environment:
      - NODE_ENV=production
      - API_URL=http://api:8000
    networks: [app-network]
    restart: always

  # ─────────────────────────────────────────────
  # api (FastAPI — 플랫폼 + LLM 도메인 통합)
  # 인증은 사내 IdP(OIDC)에 위임 — OIDC_* env로 JWKS 검증만 (ADR-0003)
  # ─────────────────────────────────────────────
  api:
    build:
      context: ../apps/api
      args:
        APP_ENV: ${APP_ENV:-production}
    container_name: v3-api
    env_file:
      - ../apps/api/.env.${APP_ENV:-production}
    environment:
      - APP_ENV=${APP_ENV:-production}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    depends_on:
      db:
        condition: service_healthy
    networks: [app-network]
    restart: on-failure
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ─────────────────────────────────────────────
  # PostgreSQL + pgvector
  # ─────────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    container_name: v3-db
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-mydb}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    ports:
      - "8066:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mydb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [app-network]
    restart: always

  # ─────────────────────────────────────────────
  # 관측 (V2 계승)
  # ─────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: v3-prometheus
    ports:
      - "8063:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [app-network]
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: v3-grafana
    ports:
      - "8064:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]
    networks: [app-network]
    restart: always

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: v3-cadvisor
    ports:
      - "8065:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [app-network]
    restart: always

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data:
  grafana-data:
