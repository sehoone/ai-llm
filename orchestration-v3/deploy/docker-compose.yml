services:
  # ─────────────────────────────────────────────
  # Nginx 리버스 프록시 (단일 진입점)
  #   :8060       → web (Next.js)
  #   :8060/api/* → api (FastAPI 단일 백엔드)
  # ─────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_BIND_ADDRESS:-127.0.0.1}:${NGINX_PORT:?NGINX_PORT is required}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api
    networks: [app-network]
    restart: always

  # ─────────────────────────────────────────────
  # web (Next.js)
  # ─────────────────────────────────────────────
  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      args:
        API_URL: http://api:8000
    environment:
      - NODE_ENV=production
      - API_URL=http://api:8000
    networks: [app-network]
    restart: always

  # ─────────────────────────────────────────────
  # api (FastAPI — 플랫폼 + LLM 도메인 통합)
  # 인증: 자체 ID/PW → HS256 JWT 발급 (ADR-0009).
  #   환경별 api.env에 JWT_SECRET_KEY·SEED_ADMIN_* 필요(없으면 로그인 불가).
  #   (OIDC_*는 보존·비활성 — IdP 복귀용)
  # ─────────────────────────────────────────────
  api:
    build:
      context: ../apps/api
    env_file:
      - ./environments/${DEPLOY_ENV:?DEPLOY_ENV is required}/api.env
    environment:
      - APP_ENV=${DEPLOY_ENV:?DEPLOY_ENV is required}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB is required}
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER is required}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      # chat 첨부는 MinIO(S3 호환)에 저장 (ADR-0017). 다운로드는 api가 프록시 스트림.
      - STORAGE_BACKEND=minio
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      - MINIO_BUCKET=chat-attachments
      - MINIO_SECURE=false
      # 회의 녹음은 전용 버킷에 분리 저장 (chat 첨부와 격리). 최초 업로드 시 자동 생성.
      - MEETING_AUDIO_BUCKET=meeting-recordings
      - UPLOAD_DIR=/data/uploads   # local 폴백용 (storage_backend=local일 때만)
      # 네트워크 좌표는 compose가 서비스 DNS로 override. api.env의 localhost 값은 bare-metal 전용.
      - LANGFUSE_HOST=http://langfuse-web:3000
    volumes:
      - api-uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks: [app-network]
    restart: on-failure
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ─────────────────────────────────────────────
  # PostgreSQL + pgvector
  # ─────────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB is required}
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER is required}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:?POSTGRES_PORT is required}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      # Langfuse 전용 DB 생성 (ADR-0007) — 볼륨 최초 init 시 1회
      - ./postgres/langfuse-db.sql:/docker-entrypoint-initdb.d/langfuse-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [app-network]
    restart: always

  # ─────────────────────────────────────────────
  # 관측 (V2 계승)
  # ─────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:?PROMETHEUS_PORT is required}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [app-network]
    restart: always

  grafana:
    image: grafana/grafana:latest
    ports:
      - "127.0.0.1:${GRAFANA_PORT:?GRAFANA_PORT is required}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?GRAFANA_PASSWORD is required}
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]
    networks: [app-network]
    restart: always

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    ports:
      - "127.0.0.1:${CADVISOR_PORT:?CADVISOR_PORT is required}:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [app-network]
    restart: always

  # ─────────────────────────────────────────────
  # LLM 관측 — Langfuse 스택 (ADR-0007). V2에서 이식.
  #   langfuse-web :8067  → Langfuse UI (프로젝트 생성 후 키 발급)
  #   전용 Postgres DB `langfuse`(db 컨테이너 공유) + ClickHouse + Redis + MinIO
  # ─────────────────────────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:24.1
    hostname: clickhouse
    environment:
      - CLICKHOUSE_DB=default
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/config.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks: [app-network]
    restart: always
    healthcheck:
      # HTTP(8123) + native TCP(9000) 모두 준비돼야 Langfuse 마이그레이션 성공
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8123/ping && clickhouse-client --query 'SELECT 1'"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  minio:
    image: minio/minio
    # Langfuse v3 버킷 + chat 첨부 버킷(ADR-0017)을 기동 시 생성(디렉터리 = 버킷).
    entrypoint: sh -c 'mkdir -p /data/langfuse-events /data/langfuse-media /data/langfuse-exports /data/chat-attachments && exec minio server /data --console-address ":9001"'
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "127.0.0.1:${MINIO_PORT:?MINIO_PORT is required}:9001"
    volumes:
      - minio-data:/data
    networks: [app-network]
    restart: always
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    networks: [app-network]
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  langfuse-web:
    image: langfuse/langfuse:3
    ports:
      - "127.0.0.1:${LANGFUSE_PORT:?LANGFUSE_PORT is required}:3000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/langfuse
      - CLICKHOUSE_URL=http://default:${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}@clickhouse:8123
      - CLICKHOUSE_MIGRATION_URL=clickhouse://default:${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}@clickhouse:9000
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NEXTAUTH_URL=${LANGFUSE_NEXTAUTH_URL:?LANGFUSE_NEXTAUTH_URL is required}
      - NEXTAUTH_SECRET=${LANGFUSE_NEXTAUTH_SECRET:?LANGFUSE_NEXTAUTH_SECRET is required}
      - SALT=${LANGFUSE_SALT:?LANGFUSE_SALT is required}
      - ENCRYPTION_KEY=${LANGFUSE_ENCRYPTION_KEY:?LANGFUSE_ENCRYPTION_KEY is required}
      - TELEMETRY_ENABLED=false
      - LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES=false
      - LANGFUSE_S3_EVENT_UPLOAD_BUCKET=langfuse-events
      - LANGFUSE_S3_EVENT_UPLOAD_REGION=auto
      - LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT=http://minio:9000
      - LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID=${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      - LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      - LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE=true
      - LANGFUSE_S3_MEDIA_UPLOAD_BUCKET=langfuse-media
      - LANGFUSE_S3_MEDIA_UPLOAD_REGION=auto
      - LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT=http://minio:9000
      - LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID=${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      - LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      - LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE=true
      - LANGFUSE_S3_BATCH_EXPORT_BUCKET=langfuse-exports
      - LANGFUSE_S3_BATCH_EXPORT_REGION=auto
      - LANGFUSE_S3_BATCH_EXPORT_ENDPOINT=http://minio:9000
      - LANGFUSE_S3_BATCH_EXPORT_ACCESS_KEY_ID=${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      - LANGFUSE_S3_BATCH_EXPORT_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      - LANGFUSE_S3_BATCH_EXPORT_FORCE_PATH_STYLE=true
    depends_on:
      db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks: [app-network]
    restart: always

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/langfuse
      - CLICKHOUSE_URL=http://default:${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}@clickhouse:8123
      - CLICKHOUSE_MIGRATION_URL=clickhouse://default:${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}@clickhouse:9000
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SALT=${LANGFUSE_SALT:?LANGFUSE_SALT is required}
      - ENCRYPTION_KEY=${LANGFUSE_ENCRYPTION_KEY:?LANGFUSE_ENCRYPTION_KEY is required}
      - TELEMETRY_ENABLED=false
      - LANGFUSE_S3_EVENT_UPLOAD_BUCKET=langfuse-events
      - LANGFUSE_S3_EVENT_UPLOAD_REGION=auto
      - LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT=http://minio:9000
      - LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID=${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      - LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      - LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE=true
      - LANGFUSE_S3_MEDIA_UPLOAD_BUCKET=langfuse-media
      - LANGFUSE_S3_MEDIA_UPLOAD_REGION=auto
      - LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT=http://minio:9000
      - LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID=${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      - LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      - LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE=true
      - LANGFUSE_S3_BATCH_EXPORT_BUCKET=langfuse-exports
      - LANGFUSE_S3_BATCH_EXPORT_REGION=auto
      - LANGFUSE_S3_BATCH_EXPORT_ENDPOINT=http://minio:9000
      - LANGFUSE_S3_BATCH_EXPORT_ACCESS_KEY_ID=${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      - LANGFUSE_S3_BATCH_EXPORT_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      - LANGFUSE_S3_BATCH_EXPORT_FORCE_PATH_STYLE=true
    depends_on:
      db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks: [app-network]
    restart: always

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data:
  grafana-data:
  clickhouse-data:
  minio-data:
  api-uploads:
