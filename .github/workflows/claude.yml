# Claude Code — PR·이슈에서 `@claude` 멘션으로 리뷰/수정/구현 요청
# 전제: 리포 Settings → Secrets → Actions 에 ANTHROPIC_API_KEY 등록
# 참고: 이 리포(sehoone/ai-llm)는 ai-llm-1 루트가 리포 루트다. GitHub Actions는
#       "리포 루트의 .github/workflows"만 실행하므로 이 파일은 반드시 루트에 둔다.
#       (orchestration-v3/.github/workflows/ci.yml 은 현재 루트가 아니라 동작하지 않음)
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    # @claude 멘션이 있을 때만 실행 (모든 코멘트마다 돌지 않도록)
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
