# WebSocket Upgrade 헤더 처리
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    # JSON 파일 업로드 허용 크기 (기본 1MB → 10MB)
    client_max_body_size 10m;

    # Docker 내부 DNS 리졸버 (컨테이너 재시작 대응)
    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;

    # ── WebSocket 전용 (Spring MVC 프록시 불가 → orchestrator 직접 연결) ──
    location /api/v1/voice-evaluation/ws/ {
        set $upstream_app app:8000;
        proxy_pass http://$upstream_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # ── 공개 아티펙트 (인증 불필요) → orchestrator 직접 연결 ──────────
    # platform-server 게이트웨이는 모든 /api/*에 인증을 요구하므로, 공개 공유
    # 링크용 엔드포인트는 orchestrator로 직접 프록시해 인증 없이 접근 가능하게 함.
    location /api/v1/public/ {
        set $upstream_public app:8000;
        proxy_pass http://$upstream_public;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
    }

    # ── 모든 API → platform-server (단일 진입점) ──────────────────────
    # platform-server 내부에서:
    #   /auth, /users, /api-keys, /llm-resources → 직접 처리
    #   그 외 /api/* → orchestrator-server로 내부 프록시
    location /api/ {
        set $upstream_platform platform:8080;
        proxy_pass http://$upstream_platform;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE 스트리밍을 위한 버퍼 비활성화
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400;
        # orchestrator가 내부 컨테이너 hostname으로 redirect 할 경우 재작성
        proxy_redirect http://app:8000/ http://$http_host/;
    }

    # ── 아티펙트 샌드박스 (선택적 강화) ───────────────────────────────
    # 아티펙트 프리뷰는 iframe srcdoc + sandbox="allow-scripts"(opaque origin) +
    # 문서 내 CSP <meta>로 이미 메인 세션과 격리됩니다. 추가로 "전용 오리진"에서
    # 샌드박스를 서빙하려면(예: usercontent 서브도메인), 해당 server 블록에
    # 아래 CSP 응답 헤더를 강제하세요. 메인 앱(location /)에는 적용하지 마세요.
    #
    # add_header Content-Security-Policy "default-src 'none'; \
    #   script-src 'unsafe-inline' 'unsafe-eval' \
    #     https://cdnjs.cloudflare.com https://unpkg.com \
    #     https://cdn.jsdelivr.net https://cdn.tailwindcss.com https://code.jquery.com; \
    #   style-src 'unsafe-inline' https://fonts.googleapis.com; \
    #   font-src https://fonts.gstatic.com; \
    #   img-src data: blob:; connect-src 'none';" always;

    # ── Next.js 프론트엔드 ─────────────────────────────────────────────
    location / {
        set $upstream_admin llm-admin:3000;
        proxy_pass http://$upstream_admin;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
    }
}
